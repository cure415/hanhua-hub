# 复古汉化发布台 · 定时抓取 + GitHub Pages 部署
# 用法：把 hanhua-hub/ 整个目录作为仓库根目录推送，然后在
#       Settings → Pages → Build and deployment 里把 Source 设为 "GitHub Actions"。
name: 抓取汉化发布并部署

on:
  schedule:
    # UTC 00:30 / 12:30 = 北京时间 08:30 / 20:30
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      max_opus:
        description: '本次最多解析几篇 B站每日汇总'
        required: false
        default: '3'
      dry_run:
        description: '只抓取不写文件（也不会提交）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hanhua-hub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 解析器离线自测
        run: node scripts/selftest.js

      - name: 抓取 B站 / 论坛 / 资讯站
        shell: bash
        run: |
          ARGS="--max-opus=${{ github.event.inputs.max_opus || '3' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "执行：node scripts/fetch.js $ARGS"
          node scripts/fetch.js $ARGS

      - name: 重新打包单文件版
        run: node scripts/build.js

      - name: 语法检查
        run: npm run check --silent

      - name: 提交数据变更
        shell: bash
        run: |
          git config user.name "hanhua-index-bot"
          git config user.email "hanhua-index-bot@users.noreply.github.com"
          git add auto-data.js overrides.js index-standalone.html data/ || true
          if git diff --cached --quiet; then
            echo "本次无新增条目，跳过提交"
          else
            git commit -m "chore(data): 定时抓取更新 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: 作业摘要
        if: always()
        run: |
          echo "### 产物" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`auto-data.js\` / \`data/auto.json\` / \`data/report.json\` / \`data/pending.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 待人工复核条目见 \`data/pending.json\`；失败源会自动保留上一次的抓取结果。" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: update
    if: needs.update.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出最新数据
        uses: actions/checkout@v4
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
